name: largefiles

# Weekly run of the large-file suite (build tag largefiles): tests and
# benchmarks over a synthetic SOFA file of more than 100 MB. Too slow and
# disk-hungry for every push; run it by hand after read/write-path changes.

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  largefiles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup just
        uses: extractions/setup-just@v2

      - name: Cache reference SOFA files
        uses: actions/cache@v4
        with:
          path: testdata/*.sofa
          key: testdata-${{ hashFiles('scripts/fetch-testdata.sh') }}

      - name: Fetch reference SOFA files
        run: just fetch-testdata

      - name: Run large-file tests and benchmarks
        run: go test -tags largefiles -run . -bench . -benchtime 1x -timeout 20m ./...
