name: test-format

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup just
        uses: extractions/setup-just@v2

      - name: Install Go formatters
        run: |
          go install mvdan.cc/gofumpt@v0.12.0
          go install github.com/daixiang0/gci@v0.14.0

      - name: Install shell formatter and checker
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.1
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Install Prettier
        run: |
          npm install -g prettier@3

      - name: Run treefmt check
        uses: isbecker/treefmt-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fail-on-change: true
          allow-missing-formatter: true
