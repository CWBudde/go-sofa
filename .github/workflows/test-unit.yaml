name: test-unit

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-unit:
    name: test-unit (Go ${{ matrix.go-version || 'from go.mod' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The minimum version from go.mod, and the latest release.
          - go-version-file: go.mod
          - go-version: stable
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          go-version-file: ${{ matrix.go-version-file }}
          cache: true

      - name: Setup just
        uses: extractions/setup-just@v2

      - name: Cache reference SOFA files
        uses: actions/cache@v4
        with:
          path: testdata/*.sofa
          key: testdata-${{ hashFiles('scripts/fetch-testdata.sh') }}

      - name: Fetch reference SOFA files
        run: just fetch-testdata

      - name: Run unit tests
        run: just test

      - name: Check coverage floor
        if: matrix.go-version-file == 'go.mod'
        run: just coverage-check
