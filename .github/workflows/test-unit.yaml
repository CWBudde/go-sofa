name: test-unit

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup just
        uses: extractions/setup-just@v2

      - name: Cache reference SOFA files
        uses: actions/cache@v4
        with:
          path: testdata/*.sofa
          key: testdata-${{ hashFiles('scripts/fetch-testdata.sh') }}

      - name: Fetch reference SOFA files
        run: just fetch-testdata

      - name: Run unit tests
        run: just test
