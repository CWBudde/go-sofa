name: test-interop

# Writes one SOFA file per DataType with sofa.Save and reads it back with the
# reference readers h5py (HDF5) and netCDF4 (netCDF-C), comparing values.

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-interop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install h5py and netCDF4
        run: python -m pip install --upgrade h5py netCDF4 numpy

      - name: Setup just
        uses: extractions/setup-just@v2

      - name: Write files with Save and check them with h5py and netCDF4
        run: just interop "${{ runner.temp }}/interop"

      - name: Upload written files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interop-files
          path: ${{ runner.temp }}/interop
