name: test-interop

# Writes one SOFA file per DataType with sofa.Save and reads it back with the
# reference readers h5py (HDF5) and netCDF4 (netCDF-C), comparing values;
# then loads those files and re-saved reference files with libmysofa at a
# pinned commit (see `just libmysofa` and internal/interop/mysofa).

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-interop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install h5py and netCDF4
        run: python -m pip install --upgrade h5py netCDF4 numpy

      - name: Install zlib for the libmysofa harness
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends zlib1g-dev

      - name: Setup just
        uses: extractions/setup-just@v2

      - name: Cache reference SOFA files
        uses: actions/cache@v4
        with:
          path: testdata/*.sofa
          key: testdata-${{ hashFiles('scripts/fetch-testdata.sh') }}

      - name: Fetch reference SOFA files
        run: just fetch-testdata

      - name: Cache the libmysofa harness
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-sofa
          key: libmysofa-${{ hashFiles('justfile', 'scripts/libmysofa/*') }}

      - name: Write files with Save and check them with h5py, netCDF4 and libmysofa
        run: just interop "${{ runner.temp }}/interop"

      - name: Upload written files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interop-files
          path: ${{ runner.temp }}/interop
